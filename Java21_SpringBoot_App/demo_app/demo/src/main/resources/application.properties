server.port=9090
spring.application.name=demo

# Spring Security cred
# spring.security.user.name=admin
# spring.security.user.password=admin

# MySQL Connection
spring.datasource.url=jdbc:mysql://mysql:3306/spring_security?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Dialect (Standard for most modern MySQL versions)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Optional: Automatic table creation/update
spring.jpa.hibernate.ddl-auto=update
# Optional: Show SQL queries in the console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

